  }

  function renderAuthUI(){
    var authSection = document.getElementById("auth-section");
    var savedAuth = getSavedAuth();
    
    // Don't show placeholder if still loading
    if(!authSection) return;
    
    if(savedAuth){
      authSection.innerHTML =
        '<div class="auth-menu">' +
        '  <div style="display: flex; align-items: center; gap: 8px; cursor: pointer;" id="auth-display" data-action="toggle-auth-menu">' +
        '    <img class="auth-profile-pic" src="' + escapeHtml(savedAuth.picture) + '" alt="Profile">' +
        '    <div class="auth-user-info">' +
        '      <div class="auth-user-name">' + escapeHtml(savedAuth.name) + '</div>' +
        '      <div class="auth-user-email">' + escapeHtml(savedAuth.email) + '</div>' +
        '    </div>' +
        '    <button type="button" id="auth-toggle" class="auth-menu-button" data-action="toggle-auth-menu">⋮</button>' +
        '  </div>' +
        '  <div id="auth-dropdown" class="auth-dropdown">' +
        '    <button type="button" class="auth-dropdown-item" data-action="switch-account">Switch Account</button>' +
        '    <button type="button" class="auth-dropdown-item" data-action="reauthorize-drive">Reconnect Google Drive</button>' +
        '    <button type="button" class="auth-dropdown-item danger" data-action="sign-out">Sign Out</button>' +
        '  </div>' +
        '</div>';
      authSection.classList.remove("guest");
    } else {
      authSection.innerHTML = '<button type="button" class="sign-in-btn" id="sign-in-btn" data-action="sign-in">Sign In with Google</button>';
      authSection.classList.add("guest");
    }
  }

  function toggleAuthMenu(e){
    e.stopPropagation();
    var menu = document.getElementById("auth-dropdown");
    if(menu.classList.contains("open")){
      menu.classList.remove("open");
    } else {
      menu.classList.add("open");
    }
  }

  function closeAuthMenu(){
    var menu = document.getElementById("auth-dropdown");
    if(menu && menu.classList.contains("open")){
      menu.classList.remove("open");
    }
  }

  function initiateSignIn(forceAccountChooser){
    if(!window.google || !window.google.accounts) {
      alert("Google Sign-In failed to load. Please refresh the page.");
      return;
    }

    var config = {
      client_id: GOOGLE_CLIENT_ID,
      scope: "openid email profile https://www.googleapis.com/auth/drive.file",
      callback: function(resp){
        if(!resp || resp.error){
          alert("Sign-in didn't go through. Please try again.");
          return;
        }
        drive.accessToken = resp.access_token;
        fetch("https://www.googleapis.com/oauth2/v2/userinfo", {
          headers: { Authorization: "Bearer " + resp.access_token }
        }).then(function(r){ return r.json(); }).then(function(userInfo){
          if(userInfo.error){
            alert("Could not fetch user info: " + userInfo.error);
            return;
          }
          saveAuth(userInfo, resp.access_token);
          renderAuthUI();
          closeAuthMenu();
          loadFromDrive();
        }).catch(function(err){
          console.error("Auth error:", err);
          alert("Authentication failed. Please try again.");
        });
      }
    };
    if(forceAccountChooser) config.prompt = "select_account";
    window.google.accounts.oauth2.initTokenClient(config).requestAccessToken();
  }

  function switchAccount(){
    closeAuthMenu();
    clearAuth();
    renderAuthUI();
    initiateSignIn(true);
  }

  function signOut(){
    closeAuthMenu();
    clearAuth();
    renderAuthUI();
    drive.connected = false;
    state.budgets.personal = DEFAULT_BUDGETS.personal;
    state.budgets.wedding = DEFAULT_BUDGETS.wedding;
    showBanner("Signed out. Your data was not deleted. Sign in again to sync.", { warn: true, action: "connect-drive", actionLabel: "🔗 Sign In with Google" });
    render();
  }

  function reauthorizeDrive(){
    closeAuthMenu();
    var savedAuth = getSavedAuth();
    if(!savedAuth){
      initiateSignIn();
      return;
    }
    connectDrive();
  }

  // ---------- Offline Mode & IndexedDB ----------

  function initOfflineSupport(){
    window.addEventListener("online", function(){
      state.isOnline = true;
      showBanner("Back online! Syncing your changes now…");
      persistToDriveNow();
      render();
    });
    window.addEventListener("offline", function(){
      state.isOnline = false;
      showBanner("You're offline. Changes are saved locally and will sync when you're back online.", { warn: true });
      render();
    });
    
    // Initialize IndexedDB for offline storage
    if(!window.indexedDB) return;
    var dbReq = window.indexedDB.open("BudgetLedgerDB", 1);
    dbReq.onerror = function(){ console.log("IndexedDB failed"); };
    dbReq.onsuccess = function(e){
      window.budgetDB = e.target.result;
      saveToIndexedDB();
    };
    dbReq.onupgradeneeded = function(e){
      var db = e.target.result;
      if(!db.objectStoreNames.contains("data")){
        db.createObjectStore("data", { keyPath: "id" });
      }
    };
  }

  function saveToIndexedDB(){
    if(!window.budgetDB) return;
    try{
      var tx = window.budgetDB.transaction(["data"], "readwrite");
      var store = tx.objectStore("data");
      store.put({ id: "budgetData", data: buildFullBackupObject(), timestamp: Date.now() });
    }catch(e){ console.log("IndexedDB save failed", e); }
  }

  function loadFromIndexedDB(){
    if(!window.budgetDB) return Promise.resolve(null);
    return new Promise(function(resolve){
      try{
        var tx = window.budgetDB.transaction(["data"], "readonly");
        var store = tx.objectStore("data");
        var req = store.get("budgetData");
        req.onsuccess = function(){ resolve(req.result ? req.result.data : null); };
        req.onerror = function(){ resolve(null); };
      }catch(e){ resolve(null); }
    });
  }

  // ---------- Overspending Alerts ----------

  function updateOverBudgetCategories(){
    var personal = [];
    var wedding = [];
    
    if(state.budgets.personal && state.budgets.personal.categories){
      var totals = categoryTotals("personal", state.personalMonth);
      state.budgets.personal.categories.forEach(function(cat){
        if(totals[cat.name] && totals[cat.name] > cat.budget){
          personal.push({ name: cat.name, spent: totals[cat.name], budget: cat.budget });
        }
      });
    }
    
    var weddingMonth = monthKeyFor("wedding");
    if(state.budgets.wedding && state.budgets.wedding.categories){
      var weddingTotals = categoryTotals("wedding", weddingMonth);
      state.budgets.wedding.categories.forEach(function(cat){
        if(weddingTotals[cat.name] && weddingTotals[cat.name] > cat.budget){
          wedding.push({ name: cat.name, spent: weddingTotals[cat.name], budget: cat.budget });
        }
      });
    }
    
    state.overBudgetCategories.personal = personal;
    state.overBudgetCategories.wedding = wedding;
  }

  function renderOverBudgetAlert(){
    var total = state.overBudgetCategories.personal.length + state.overBudgetCategories.wedding.length;
    if(total === 0) return "";
    return '<div class="alert-badge">⚠️ ' + total + ' categor' + (total === 1 ? 'y' : 'ies') + ' over budget</div>';
  }

  // ---------- Savings Goals ----------

  function saveSavingsGoals(){
    schedulePersist();
  }

  function addSavingsGoal(goal){
    if(!state.savingsGoals) state.savingsGoals = { items: [] };
    goal.id = uid("goal");
    goal.createdAt = todayStr();
    state.savingsGoals.items.push(goal);
    recordChange("personal", "Added savings goal \"" + goal.name + "\"");
    saveSavingsGoals();
  }

  function removeSavingsGoal(id){
    if(!state.savingsGoals || !state.savingsGoals.items) return;
    var removed = state.savingsGoals.items.find(function(g){ return g.id === id; });
    state.savingsGoals.items = state.savingsGoals.items.filter(function(g){ return g.id !== id; });
    if(removed) recordChange("personal", "Removed savings goal \"" + removed.name + "\"");
    saveSavingsGoals();
  }

  function updateSavingsGoal(id, changes){
    if(!state.savingsGoals || !state.savingsGoals.items) return;
    var goal = state.savingsGoals.items.find(function(g){ return g.id === id; });
    if(goal){ Object.assign(goal, changes); saveSavingsGoals(); }
  }

  function editSavingsGoal(id){
    var goal = state.savingsGoals.items.find(function(g){ return g.id === id; });
    if(!goal) return;
    var current = prompt("Update current amount (currently " + goal.current + "):");
    if(current !== null){
      updateSavingsGoal(id, { current: parseFloat(current) || 0 });
      render();
    }
  }

  function renderSavingsGoalsSection(){
    if(!state.savingsGoals || !state.savingsGoals.items){
      state.savingsGoals = { items: [] };
    }
    
    var html = '<section class="goals-section" id="goals-section">';
    html += '<div class="section-head"><div class="section-title">Savings Goals</div></div>';
    
    if(state.savingsGoals.items.length === 0){
      html += '<div style="color: var(--text-muted); font-size: 13px; padding: 16px;">No goals yet. <a href="#" data-action="add-savings-goal" style="color: var(--accent-personal); cursor: pointer;">Add one →</a></div>';
    } else {
      state.savingsGoals.items.forEach(function(goal){
        var pct = goal.current ? Math.round((goal.current / goal.target) * 100) : 0;
        var monthlySave = goal.monthlyContribution || 0;
        var monthsLeft = goal.dueDate ? ((new Date(goal.dueDate) - new Date()) / (1000 * 60 * 60 * 24 * 30)) : 0;
        var neededMonthly = monthsLeft > 0 ? Math.round((goal.target - (goal.current || 0)) / monthsLeft) : 0;
        var isOnTrack = monthsLeft <= 0 || monthlySave >= neededMonthly;
        
        html += '<div class="goal-card">';
        html += '<div class="goal-header"><span class="goal-name">' + escapeHtml(goal.name) + '</span></div>';
        html += '<div class="goal-progress">';
        html += '<div class="goal-bar"><div class="goal-bar-fill" style="width:' + Math.min(pct, 100) + '%"></div></div>';
        html += '<div class="goal-stats"><span>' + currency.format(goal.current || 0) + ' / ' + currency.format(goal.target) + '</span><span>' + pct + '%</span></div>';
        if(monthsLeft > 0){
          html += '<div class="goal-status ' + (isOnTrack ? 'on-track' : 'behind') + '">';
          html += isOnTrack ? '✓ On track' : '⚠️ Need ' + currency.format(neededMonthly) + '/mo (currently ' + currency.format(monthlySave) + ')';
          html += '</div>';
        }
        html += '</div>';
        html += '<div style="display:flex; gap:6px; margin-top:8px; font-size:12px;"><button type="button" class="ghost-btn" style="padding: 0; border: none; font-size: 12px;" data-action="edit-savings-goal" data-id="' + goal.id + '">Edit</button><button type="button" class="ghost-btn" style="padding: 0; border: none; font-size: 12px; color: var(--status-critical);" data-action="remove-savings-goal" data-id="' + goal.id + '">Remove</button></div>';
        html += '</div>';
      });
    }
    
    html += '<div style="padding: 12px 0;"><button type="button" class="ghost-btn" data-action="add-savings-goal">+ Add Goal</button></div>';
    html += '</section>';
    return html;
  }

  function showAddGoalForm(ev){
    if(ev) ev.preventDefault();
    var name = prompt("Goal name (e.g., Emergency Fund):");
    if(!name) return;
    var targetStr = prompt("Target amount (e.g., 5000):");
    if(!targetStr) return;
    var target = parseFloat(targetStr);
    if(isNaN(target) || target <= 0) return;
    var currentStr = prompt("Current amount (e.g., 0):");
    var current = currentStr ? parseFloat(currentStr) : 0;
    if(isNaN(current)) current = 0;
    
    addSavingsGoal({
      name: name,
      target: target,
      current: current,
      monthlyContribution: 0,
      dueDate: null
    });
    render();
  }

  // ---------- Year-over-Year Comparison ----------

  function getPreviousYearMonth(monthKey){
    var year = parseInt(monthKey.slice(0, 4));
    var month = monthKey.slice(4);
    return (year - 1) + month;
  }

  function getYoYComparison(tracker, monthKey){
    var currentTotals = categoryTotals(tracker, monthKey);
    var previousTotals = categoryTotals(tracker, getPreviousYearMonth(monthKey));
    var comparison = {};
    
    if(Array.isArray(currentTotals) && Array.isArray(previousTotals)){
      currentTotals.forEach(function(cat){
        var prev = previousTotals.find(function(c){ return c.name === cat.name; });
        var prevSpent = prev ? (prev.spent || 0) : 0;
        var currSpent = cat.spent || 0;
        var change = currSpent - prevSpent;
        var pctChange = prevSpent === 0 ? (currSpent > 0 ? 100 : 0) : Math.round((change / prevSpent) * 100);
        comparison[cat.name] = { current: currSpent, previous: prevSpent, change: change, pctChange: pctChange };
      });
    }
    
    return comparison;
  }

  // ---------- Forecasting ----------

  function calculateForecast(tracker){
    var currentMonth = monthKeyFor(tracker);
    if(!currentMonth) return [];
    var currentYear = currentMonth.slice(0, 4);
    var forecast = [];
    
    // Get last 3 months average
    var months = [
      shiftMonth(currentMonth, -2),
      shiftMonth(currentMonth, -1),
      currentMonth
    ];
    
    var monthlyTotals = [];
    months.forEach(function(m){ 
      var cats = categoryTotals(tracker, m);
      if(Array.isArray(cats)){
        var total = cats.reduce(function(sum, cat){ return sum + (Number(cat.spent) || 0); }, 0);
        monthlyTotals.push(total);
      }
    });
    
    var monthlyAvg = monthlyTotals.length > 0 ? 
      monthlyTotals.reduce(function(a,b){ return a + b; }, 0) / monthlyTotals.length : 0;
    
    var budgetTotal = getBudgetForTracker(tracker) || 0;
    
    // Project remaining months
    for(var i = 1; i <= 9; i++){
      var projMonth = shiftMonth(currentMonth, i);
      var projYear = projMonth.slice(0, 4);
      if(projYear === currentYear){
        var totalSpentSoFar = monthlyAvg * (i - 1);
        var remaining = Math.max(0, budgetTotal - totalSpentSoFar - monthlyAvg);
        forecast.push({
          month: monthLabel(projMonth),
          projected: monthlyAvg,
          remaining: remaining
        });
      }
    }
    
    return forecast;
  }

  function getBudgetForTracker(tracker){
    if(!state.budgets[tracker] || !state.budgets[tracker].categories) return 0;
    return state.budgets[tracker].categories.reduce(function(sum, cat){ return sum + (cat.budget || 0); }, 0);
  }

  function renderForecastSection(tracker){
    var forecast = calculateForecast(tracker);
    if(forecast.length === 0) return '';
    
    var budget = getBudgetForTracker(tracker);
    var html = '<section><div class="section-head"><div class="section-title">Spending Forecast</div><div class="section-hint">At current pace</div></div>';
    html += '<div class="forecast-card">';
    
    forecast.slice(0, 6).forEach(function(f){
      var isWarning = f.remaining < 0;
      var isLow = f.remaining < (budget * 0.2) && f.remaining > 0;
      html += '<div class="forecast-month">';
      html += '<div class="forecast-label">' + f.month + '</div>';
      html += '<div class="forecast-value ' + (isWarning ? 'forecast-critical' : isLow ? 'forecast-warning' : '') + '">';
      html += currency.format(Math.max(0, f.remaining)) + ' left';
      if(isWarning) html += ' ❌';
      else if(isLow) html += ' ⚠️';
      html += '</div>';
      html += '</div>';
    });
    
    html += '</div></section>';
    return html;
  }

  // Close auth menu when clicking outside
  document.addEventListener("click", function(ev){
    if(ev.target.closest(".auth-menu")) return;
    closeAuthMenu();
  });

  function init(){
    state.budgets.personal = DEFAULT_BUDGETS.personal;
    state.budgets.wedding = DEFAULT_BUDGETS.wedding;
    initOfflineSupport();
    renderAuthUI();
    updateOverBudgetCategories();
    render();
    initSample();
    initDownloads();

    if(!driveConfigured()){
      showBanner("This copy hasn't been set up with a Google Client ID yet, so what's shown below are starter placeholders that won't be saved. See the \"GOOGLE DRIVE SETUP\" comment near the top of the file for the one-time steps.", { warn: true });
      return;
    }

    var savedAuth = getSavedAuth();
    if(savedAuth){
      drive.accessToken = savedAuth.accessToken;
      showBanner("Loading your data from Google Drive…");
      loadFromDrive();
    } else {
      showBanner("Connect Google Drive to load and save your data.", { action: "connect-drive", actionLabel: "🔗 Connect Google Drive" });
    }
  }

  init();
})();
</script>
