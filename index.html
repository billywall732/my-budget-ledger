<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget Ledger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    color-scheme: light;
    --bg: #f7f2e9;
    --surface: #ffffff;
    --surface-2: #fbf7ef;
    --text-primary: #221d15;
    --text-secondary: #6e6656;
    --text-muted: #9a9280;
    --border: rgba(34,29,21,0.12);
    --border-strong: rgba(34,29,21,0.20);

    --accent-personal: #2f6f62;
    --accent-personal-soft: rgba(47,111,98,0.12);
    --accent-wedding: #a8552f;
    --accent-wedding-soft: rgba(168,85,47,0.12);

    --status-good: #0ca30c;
    --status-warning-bg: #fab219;
    --status-warning-text: #7a5200;
    --status-critical: #d03b3b;

    --chart-expense: #ab5c49;
    --chart-income: #5c8567;

    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #b8860a;
    --series-5: #d0568a;
    --series-6: #008300;
    --series-7: #4a3aa7;
    --series-8: #e34948;

    --shadow: 0 1px 2px rgba(34,29,21,0.06), 0 8px 24px -12px rgba(34,29,21,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg: #16130e;
      --surface: #201b14;
      --surface-2: #262019;
      --text-primary: #f4efe4;
      --text-secondary: #c7bea9;
      --text-muted: #8f8672;
      --border: rgba(244,239,228,0.12);
      --border-strong: rgba(244,239,228,0.22);

      --accent-personal: #59a892;
      --accent-personal-soft: rgba(89,168,146,0.16);
      --accent-wedding: #dd8a63;
      --accent-wedding-soft: rgba(221,138,99,0.16);

      --status-good: #37c23a;
      --status-warning-bg: #c98500;
      --status-warning-text: #fbe1ad;
      --status-critical: #e66767;

      --chart-expense: #c98a78;
      --chart-income: #85ac90;

      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-5: #d55181;
      --series-6: #2fae2f;
      --series-7: #9085e9;
      --series-8: #e66767;

      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg: #16130e;
    --surface: #201b14;
    --surface-2: #262019;
    --text-primary: #f4efe4;
    --text-secondary: #c7bea9;
    --text-muted: #8f8672;
    --border: rgba(244,239,228,0.12);
    --border-strong: rgba(244,239,228,0.22);

    --accent-personal: #59a892;
    --accent-personal-soft: rgba(89,168,146,0.16);
    --accent-wedding: #dd8a63;
    --accent-wedding-soft: rgba(221,138,99,0.16);

    --status-good: #37c23a;
    --status-warning-bg: #c98500;
    --status-warning-text: #fbe1ad;
    --status-critical: #e66767;

    --chart-expense: #c98a78;
    --chart-income: #85ac90;

    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #2fae2f;
    --series-7: #9085e9;
    --series-8: #e66767;

    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  *{ box-sizing: border-box; }
  body{
    background: var(--bg);
    color: var(--text-primary);
    font-family: "Work Sans", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  .page{
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }
  header.top{
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
  }
  .header-left{
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }
  h1{
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 34px;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }
  .subtitle{
    color: var(--text-secondary);
    font-size: 15px;
    margin: 0;
  }

  /* Google Auth UI */
  .auth-section{
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 8px;
    font-size: 13.5px;
  }
  .auth-section.guest{
    background: transparent;
    border: none;
    padding: 0;
  }
  .auth-profile-pic{
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: cover;
    cursor: pointer;
    border: 1px solid var(--border);
  }
  .auth-user-info{
    display: flex;
    flex-direction: column;
    gap: 0;
    cursor: pointer;
    min-width: 0;
  }
  .auth-user-name{
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .auth-user-email{
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .auth-menu{
    position: relative;
    display: inline-block;
  }
  .auth-menu-button{
    appearance: none;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px 2px;
    font-size: 14px;
    line-height: 1;
  }
  .auth-menu-button:hover{
    color: var(--text-primary);
  }
  .auth-dropdown{
    position: absolute;
    top: 100%;
    right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow);
    min-width: 160px;
    z-index: 1000;
    display: none;
  }
  .auth-dropdown.open{
    display: block;
  }
  .auth-dropdown-item{
    display: block;
    width: 100%;
    padding: 10px 12px;
    border: none;
    background: none;
    color: var(--text-primary);
    text-align: left;
    cursor: pointer;
    font-family: "Work Sans", sans-serif;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .auth-dropdown-item:last-child{
    border-bottom: none;
  }
  .auth-dropdown-item:hover{
    background: var(--surface-2);
  }
  .auth-dropdown-item.danger{
    color: var(--status-critical);
  }
  .sign-in-btn{
    appearance: none;
    background: var(--accent-personal);
    border: none;
    color: #fff;
    font-family: "Work Sans", sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(47, 111, 98, 0.2);
    transition: all 0.2s ease;
  }
  .sign-in-btn:hover{
    filter: brightness(1.1);
    box-shadow: 0 4px 12px rgba(47, 111, 98, 0.3);
    transform: translateY(-1px);
  }

  /* Offline & Sync Status */
  .offline-indicator{
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--status-critical);
    font-weight: 500;
  }
  .offline-dot{
    width: 6px;
    height: 6px;
    background: var(--status-critical);
    border-radius: 50%;
  }

  /* Overspending Alert */
  .alert-badge{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: color-mix(in srgb, var(--status-critical) 16%, transparent);
    color: var(--status-critical);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 100px;
    margin-top: 8px;
  }
  .overspend-badge{
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: color-mix(in srgb, var(--status-critical) 12%, transparent);
    color: var(--status-critical);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
  }

  /* Savings Goals UI */
  .goals-section{ margin-bottom: 28px; }
  .goal-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
  }
  .goal-header{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .goal-name{
    font-weight: 500;
    font-size: 14px;
  }
  .goal-progress{
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .goal-bar{
    height: 6px;
    background: var(--surface-2);
    border-radius: 100px;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .goal-bar-fill{
    background: linear-gradient(90deg, var(--accent-personal), var(--series-3));
    height: 100%;
    border-radius: 100px;
  }
  .goal-stats{
    display: flex;
    font-size: 12px;
    color: var(--text-secondary);
    justify-content: space-between;
  }
  .goal-status{
    font-size: 12px;
    font-weight: 500;
    margin-top: 6px;
  }
  .goal-status.on-track{ color: var(--status-good); }
  .goal-status.behind{ color: var(--status-warning-bg); }

  /* Forecast & Trends */
  .forecast-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  .forecast-month{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .forecast-month:last-child{ border-bottom: none; }
  .forecast-label{ color: var(--text-secondary); }
  .forecast-value{
    font-family: "IBM Plex Mono", monospace;
    font-weight: 500;
  }
  .forecast-warning{
    color: var(--status-warning-bg);
  }
  .forecast-critical{
    color: var(--status-critical);
  }

  /* Change Log */
  .changelog-card{
    padding: 4px 16px;
  }
  .changelog-row{
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .changelog-row:last-child{ border-bottom: none; }
  .changelog-summary{ font-size: 13px; color: var(--text-primary); }
  .changelog-meta{
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
    text-align: right;
  }

  /* Year-over-Year */
  .yoy-comparison{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
  }
  .yoy-item{
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .yoy-label{
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
  }
  .yoy-value{
    font-family: "IBM Plex Mono", monospace;
    font-weight: 500;
  }
  .yoy-change{
    font-size: 12px;
    font-weight: 500;
  }
  .yoy-change.up{ color: var(--status-warning-bg); }
  .yoy-change.down{ color: var(--status-good); }

  .tabs{
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .tab{
    appearance: none;
    background: none;
    border: none;
    font-family: "Fraunces", Georgia, serif;
    font-size: 17px;
    font-weight: 500;
    color: var(--text-muted);
    padding: 10px 4px 12px;
    margin-right: 22px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transform: translateY(1px);
  }
  .tab:hover{ color: var(--text-primary); }
  .tab.active{ color: var(--text-primary); }
  .tab[data-tracker="personal"].active{ border-bottom-color: var(--accent-personal); }
  .tab[data-tracker="wedding"].active{ border-bottom-color: var(--accent-wedding); }

  .subnav{ display: flex; gap: 6px; margin-bottom: 24px; flex-wrap: wrap; }
  .subnav-btn{
    appearance: none;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-family: "Work Sans", sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: 100px;
    cursor: pointer;
  }
  .subnav-btn:hover{ color: var(--text-primary); border-color: var(--border-strong); }
  .subnav-btn.active{ color: #fff; border-color: transparent; }
  #personal-panel .subnav-btn.active{ background: var(--accent-personal); }
  #wedding-panel .subnav-btn.active{ background: var(--accent-wedding); }

  .back-link{
    appearance: none;
    background: none;
    border: none;
    color: var(--text-secondary);
    font-family: "Work Sans", sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    padding: 0;
    margin-bottom: 20px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .back-link:hover{ color: var(--text-primary); }

  section{ margin-bottom: 28px; }
  .section-head{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .section-title{
    font-family: "Fraunces", Georgia, serif;
    font-weight: 500;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
  }
  .section-hint{
    font-size: 13px;
    color: var(--text-muted);
  }

  .month-switch{
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 5px 6px 5px 14px;
    font-size: 13.5px;
    font-weight: 500;
  }
  .month-switch button{
    appearance: none;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-primary);
    width: 24px; height: 24px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    line-height: 1;
  }
  .month-switch button:hover{ background: var(--border); }

  .stat-row{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .stat-tile{
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .stat-label{
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .stat-value{
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.01em;
    overflow-wrap: break-word;
  }
  .status-chip{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    font-size: 12.5px;
    font-weight: 500;
    padding: 3px 9px 3px 7px;
    border-radius: 100px;
  }
  .status-chip .dot{ width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .status-chip.good{ background: color-mix(in srgb, var(--status-good) 16%, transparent); color: var(--status-good); }
  .status-chip.good .dot{ background: var(--status-good); }
  .status-chip.warning{ background: color-mix(in srgb, var(--status-warning-bg) 22%, transparent); color: var(--status-warning-text); }
  .status-chip.warning .dot{ background: var(--status-warning-bg); }
  .status-chip.critical{ background: color-mix(in srgb, var(--status-critical) 16%, transparent); color: var(--status-critical); }
  .status-chip.critical .dot{ background: var(--status-critical); }

  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
  }

  /* Payment-type mini tiles */
  .ptype-row{ display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .ptype-tile{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
  }
  .ptype-tile .ptype-label{
    display: flex; align-items: center; gap: 6px;
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-muted); margin-bottom: 6px;
  }
  .ptype-tile .ptype-label .swatch{ width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .ptype-tile .ptype-value{ font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 500; }

  /* Category breakdown (clickable on dashboard) */
  .cat-list{ display: flex; flex-direction: column; }
  .cat-row{
    display: grid;
    grid-template-columns: 150px 1fr 128px 28px;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .cat-row:last-child{ border-bottom: none; }
  .cat-row.clickable{ cursor: pointer; grid-template-columns: 150px 1fr 128px 16px; }
  .cat-row.clickable:hover{ background: var(--surface-2); }
  .cat-name{
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 14px;
    font-weight: 500;
    min-width: 0;
  }
  .cat-name .swatch{ width: 9px; height: 9px; border-radius: 50%; flex: none; margin-top: 2px; }
  .cat-name span{ overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-name-inner{ display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; }
  .cat-chevron{ color: var(--text-muted); font-size: 15px; text-align: right; }
  .bar-track{
    position: relative;
    height: 8px;
    border-radius: 100px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .bar-fill{
    position: absolute;
    inset: 0 auto 0 0;
    border-radius: 100px;
  }
  .cat-amounts{
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    text-align: right;
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .cat-amounts b{ color: var(--text-primary); font-weight: 500; }
  .cat-amounts.over b{ color: var(--status-critical); }
  .edit-budget-btn{
    appearance: none;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    width: 24px;
    height: 24px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .edit-budget-btn:hover{ background: var(--surface-2); color: var(--text-primary); }
  .budget-edit-input{
    width: 100%;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    text-align: right;
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 4px 6px;
    color: var(--text-primary);
  }

  .add-category-form{ display: flex; gap: 8px; padding: 12px 16px; flex-wrap: wrap; }
  .add-category-form input{
    flex: 1 1 200px;
    font-family: "Work Sans", sans-serif;
    font-size: 13.5px;
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    padding: 7px 10px;
    color: var(--text-primary);
  }
  .ghost-btn{
    appearance: none;
    background: none;
    border: 1px dashed var(--border-strong);
    color: var(--text-secondary);
    font-family: "Work Sans", sans-serif;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 100px;
    cursor: pointer;
  }
  .ghost-btn:hover{ color: var(--text-primary); border-color: var(--text-muted); }

  /* Payment methods */
  .pm-body{ padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .pm-list{ display: flex; flex-wrap: wrap; gap: 8px; }
  .pm-chip{
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 10px;
    font-size: 13px;
  }
  .pm-chip .pm-name{ font-weight: 500; }
  .pm-chip .pm-last4{ color: var(--text-muted); font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .pm-chip .pm-total{ color: var(--text-muted); font-family: "IBM Plex Mono", monospace; font-size: 11.5px; padding-left: 4px; border-left: 1px solid var(--border); margin-left: 2px; }
  .pm-chip .pm-remove{
    appearance: none; background: none; border: none; color: var(--text-muted);

    if(!iso) return "";
    var parts = iso.split("-");
    if(parts.length !== 3) return iso;
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  }

  function addToDate(iso, cycle){
    var parts = (iso || todayStr()).split("-").map(Number);
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    if(cycle === "yearly") d.setFullYear(d.getFullYear() + 1);
    else if(cycle === "weekly") d.setDate(d.getDate() + 7);
    else if(cycle === "biweekly") d.setDate(d.getDate() + 14);
    else if(cycle === "semimonthly") d.setDate(d.getDate() + 15);
    else d.setMonth(d.getMonth() + 1);
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  function statusFor(spent, budget){
    if(budget <= 0) return spent > 0 ? "critical" : "good";
    var pct = spent / budget;
    if(pct > 1) return "critical";
    if(pct >= 0.8) return "warning";
    return "good";
  }

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];

  function monthlyHistory(tracker, months){
    var out = [];
    var d = new Date();
    d.setDate(1);
    for(var i = months - 1; i >= 0; i--){
      var dd = new Date(d.getFullYear(), d.getMonth() - i, 1);
      var key = dd.getFullYear() + "-" + String(dd.getMonth() + 1).padStart(2, "0");
      out.push({ key: key, spent: 0 });
    }
    var byKey = {};
    out.forEach(function(m){ byKey[m.key] = m; });
    state.expenses.forEach(function(e){
      if(e.tracker !== tracker) return;
      var k = (e.date || "").slice(0, 7);
      if(byKey[k]) byKey[k].spent += Number(e.amount) || 0;
    });
    return out;
  }

  function buildExpensesCsv(){
    var rows = [["Tracker", "Date", "Category", "Subcategory", "Vendor", "Payment Type", "Card", "Amount", "Note"]];
    state.expenses.slice().sort(function(a, b){ return (a.date || "").localeCompare(b.date || ""); }).forEach(function(e){
      var card = e.cardId ? paymentMethodById(e.cardId) : null;
      rows.push([
        e.tracker, e.date || "", e.category || "", e.subcategory || "", vendorLabel(e),
        paymentTypeMeta(e.paymentType || "cash").label,
        card ? card.name + (card.last4 ? " ••" + card.last4 : "") : "",
        (Number(e.amount) || 0).toFixed(2), e.note || ""
      ]);
    });
    return rows.map(function(r){ return r.map(csvField).join(","); }).join("\r\n");
  }

  function parseCsv(text){
    var rows = [];
    var row = [];
    var field = "";
    var inQuotes = false;
    for(var i = 0; i < text.length; i++){
      var c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i + 1] === '"'){ field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else if(c === '"'){
        inQuotes = true;
      } else if(c === ","){
        row.push(field); field = "";
      } else if(c === "\n" || c === "\r"){
        if(c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); field = "";
        if(row.some(function(f){ return f !== ""; })) rows.push(row);
        row = [];
      } else field += c;
    }
    if(field !== "" || row.length){ row.push(field); rows.push(row); }
    return rows;
  }

    html += '    <div class="field"><label>Category</label><select name="category">' + totals.map(function(c){ return '<option value="' + escapeHtml(c.name) + '">' + escapeHtml(c.name) + '</option>'; }).join("") + '</select></div>';
    html += '    <div class="field"><label>Vendor / Payee</label><input type="text" name="vendor" list="vendor-dl-sub-' + tracker + '" placeholder="e.g. Spotify" maxlength="60"></div>';
    html += paymentTypeFieldHtml("sub", "cash", "");
    html += '    <div class="field"><label>Next date</label><input type="date" name="nextDate" value="' + todayStr() + '"></div>';
    html += '    <button type="submit" class="submit-btn neutral">Add</button>';
    html += vendorDatalistHtml(tracker, "vendor-dl-sub-" + tracker);
    html += '  </form>';
    html += '  </div>';
    html += '</section>';
    return html;
  }

  function renderTrendChart(tracker){
    var days = 30;
    var buckets = [];
    var today = new Date();
    today.setHours(0,0,0,0);
    for(var i = days - 1; i >= 0; i--){
      var d = new Date(today);
      d.setDate(d.getDate() - i);
      var key = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
      buckets.push({ date: key, total: 0 });
    }
    var byDate = {};
    buckets.forEach(function(b){ byDate[b.date] = b; });
    state.expenses.forEach(function(e){
      if(e.tracker !== tracker) return;
      if(byDate[e.date]) byDate[e.date].total += Number(e.amount) || 0;
    });
    var max = Math.max.apply(null, buckets.map(function(b){ return b.total; }).concat([1]));
    var w = 600, h = 100, gap = 2;
    var bw = (w / days) - gap;
    var accent = tracker === "wedding" ? "var(--accent-wedding)" : "var(--accent-personal)";

    var svg = '<svg class="trend-svg" viewBox="0 0 ' + w + ' ' + (h + 4) + '" preserveAspectRatio="none" role="img" aria-label="Daily spending, last 30 days">';
    buckets.forEach(function(b, i){
      var bh = Math.max(b.total > 0 ? 3 : 1, Math.round((b.total / max) * (h - 6)));
      var x = i * (bw + gap);
      var y = h - bh;
      svg += '<rect class="trend-bar" data-date="' + b.date + '" data-amount="' + b.total.toFixed(2) + '" x="' + x.toFixed(1) + '" y="' + y + '" width="' + Math.max(bw,1).toFixed(1) + '" height="' + bh + '" rx="1.5" style="fill:' + accent + ';opacity:' + (b.total > 0 ? '1' : '0.28') + '"><title>' + fmtDate(b.date) + ': ' + currency.format(b.total) + '</title></rect>';
    });
    svg += '</svg>';

    var html = '<section>';
    html += '  <div class="section-head"><span class="section-title">Spending trend</span><span class="section-hint">Last 30 days · tap a bar for the total</span></div>';
    html += '  <div class="card trend-wrap">';
    html += svg;
    html += '  <div class="trend-axis"><span>' + fmtDate(buckets[0].date) + '</span><span>' + fmtDate(buckets[buckets.length-1].date) + '</span></div>';
    html += '  <div class="trend-caption" id="trend-caption-' + tracker + '">Tap a bar to see that day&#39;s total.</div>';
    html += '  </div>';
    html += '</section>';
    return html;
  }

  function renderDashboard(tracker){
    var monthKey = monthKeyFor(tracker);
    var totals = categoryTotals(tracker, monthKey);
    var totalBudget = totals.reduce(function(s, c){ return s + (Number(c.budget) || 0); }, 0);
    var totalSpent = totals.reduce(function(s, c){ return s + (Number(c.spent) || 0); }, 0);
    var remaining = totalBudget - totalSpent;
    var overallStatus = statusFor(totalSpent, totalBudget);
    var statusLabel = overallStatus === "critical" ? "Over budget" : overallStatus === "warning" ? "Near limit" : "On track";
    var ptypeTotals = paymentTypeTotals(tracker, monthKey);
    var subs = (state.subscriptions[tracker] && state.subscriptions[tracker].items) || [];
    var monthlyRecurring = subs.reduce(function(s, i){ return s + (i.cycle === "yearly" ? (Number(i.amount) || 0) / 12 : (Number(i.amount) || 0)); }, 0);

    var html = "";

    var totalMiles = totals.reduce(function(s, c){ return s + (c.milesSpent || 0); }, 0);

    html += '<section>';
    html += '  <div class="section-head">';
    html += '    <span class="section-title">📊 Overview</span>';
    if(monthKey){
      html += '    <span class="month-switch"><button data-action="month-prev" title="Previous month">‹</button>' + monthLabel(monthKey) + '<button data-action="month-next" title="Next month">›</button></span>';
    } else {
      html += '    <span class="section-hint">All-time</span>';
    }
    html += '  </div>';
    html += '  <div class="stat-row">';
    html += statTile("💰 Budgeted", currency.format(totalBudget));
    html += statTile("💸 Spent", currency.format(totalSpent), totalMiles > 0 ? '<div class="section-hint" style="margin-top:6px">✈️ ' + currency.format(totalMiles) + ' via miles</div>' : '');
    html += statTile(remaining < 0 ? "⚠️ Over by" : "✅ Remaining", currency.format(Math.abs(remaining)),
      '<span class="status-chip ' + overallStatus + '"><span class="dot"></span>' + statusLabel + '</span>');
    html += '  </div>';
    html += '</section>';

    html += '<section>';
    html += '  <div class="section-head"><span class="section-title">💳 By payment type</span></div>';
    html += '  <div class="ptype-row">';
    PAYMENT_TYPES.forEach(function(t, i){
      html += '<div class="ptype-tile"><div class="ptype-label">' + t.emoji + ' ' + t.label + '</div><div class="ptype-value">' + currency.format(ptypeTotals[t.id] || 0) + '</div></div>';
    });
    html += '  </div>';
    html += '</section>';

    html += renderCashFlowSection(tracker, monthKey);
    html += renderCashFlowTrendChart(tracker);

    html += renderTrendChart(tracker);
    html += renderHistorySection(tracker);

    if(tracker === "wedding"){
      html += renderVendorsSummaryCard();
    }

    html += '<section>';
    html += '  <div class="section-head"><span class="section-title">🗂️ Categories</span><span class="section-hint">Tap a category for its transactions</span></div>';
    html += '  <div class="card"><div class="cat-list">';
    totals.forEach(function(c, i){
      var pct = c.budget > 0 ? Math.min(100, Math.round((c.spent / c.budget) * 100)) : (c.spent > 0 ? 100 : 0);
      var st = statusFor(c.spent, c.budget);
      var fillColor = st === "critical" ? "var(--status-critical)" : st === "warning" ? "var(--status-warning-bg)" : "var(" + seriesVarFor(i) + ")";
      html += '<div class="cat-row clickable" data-action="open-category" data-tracker="' + tracker + '" data-name="' + escapeHtml(c.name) + '">';
      html += '  <div class="cat-name"><span class="swatch" style="background:var(' + seriesVarFor(i) + ')"></span><span title="' + escapeHtml(c.name) + '">' + escapeHtml(c.name) + '</span></div>';
      html += '  <div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + fillColor + '"></div></div>';
      html += '  <div class="cat-amounts' + (c.spent > c.budget && c.budget > 0 ? ' over' : '') + '"><b>' + currency.format(c.spent) + '</b> / ' + currency.format(c.budget) + milesNote(c) + '</div>';
      html += '  <div class="cat-chevron">›</div>';
      html += '</div>';
    });
    if(totals.length === 0){
      html += '<div class="empty-note">No categories yet — add some in Manage.</div>';
    }
    html += '  </div></div>';
    html += '</section>';

    html += '<section>';
    html += '  <div class="dash-links">';
    html += '    <button type="button" class="dash-link-card" data-action="nav" data-tracker="' + tracker + '" data-page="log"><div class="dl-title">📝 Log an expense →</div><div class="dl-sub">Scan a receipt or enter one by hand</div></button>';
    html += '    <button type="button" class="dash-link-card" data-action="nav" data-tracker="' + tracker + '" data-page="log"><div class="dl-title">🔁 Subscriptions: ' + (subs.length ? ('~' + currency.format(monthlyRecurring) + '/mo') : 'none yet') + ' →</div><div class="dl-sub">Manage recurring payments, on the Log Expense page</div></button>';
    html += '    <button type="button" class="dash-link-card" data-action="nav" data-tracker="' + tracker + '" data-page="income"><div class="dl-title">💵 Income sources →</div><div class="dl-sub">Log income and set up recurring paychecks</div></button>';
    if(tracker === "personal"){
      html += '    <button type="button" class="dash-link-card" data-action="nav" data-tracker="personal" data-page="salary"><div class="dl-title">🧮 Salary & paycheck →</div><div class="dl-sub">Set your salary and deductions to see your net pay</div></button>';
    }
    html += '  </div>';
    html += '</section>';

    if(tracker !== "wedding"){
      // Add forecast section
      html += renderForecastSection(tracker) || "";

      // Add year-over-year if data available
      try{
        var yoyComparison = getYoYComparison(tracker, monthKey);
        if(yoyComparison && Object.keys(yoyComparison).length > 0){
          html += '<section><div class="section-head"><div class="section-title">📈 vs Last Year</div></div>';
          html += '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">';
          Object.keys(yoyComparison).slice(0, 4).forEach(function(cat){
            var data = yoyComparison[cat];
            if(data && !isNaN(data.current) && !isNaN(data.previous)){
              html += '<div class="card" style="padding: 12px 14px;"><div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 4px;">' + escapeHtml(cat) + '</div>';
              html += '<div class="yoy-comparison">';
              html += '<div class="yoy-item"><div class="yoy-label">This year</div><div class="yoy-value">' + currency.format(data.current) + '</div></div>';
              html += '<div class="yoy-item"><div class="yoy-label">Last year</div><div class="yoy-value">' + currency.format(data.previous) + '</div></div>';
              html += '</div>';
              html += '<div class="yoy-change ' + (data.pctChange > 0 ? 'up' : data.pctChange < 0 ? 'down' : '') + '">' + (data.pctChange > 0 ? '+' : '') + data.pctChange + '%</div>';
              html += '</div>';
            }
          });
          html += '</div></section>';
        }
      }catch(e){ console.log("YoY error", e); }
    }

    return html;
  }

  function renderCashFlowSection(tracker, monthKey){
    var income = incomeTotals(tracker, monthKey);
    var catTotals = categoryTotals(tracker, monthKey);
    var spent = catTotals.reduce(function(s, c){ return s + c.spent; }, 0);
    var totalBudget = catTotals.reduce(function(s, c){ return s + (Number(c.budget) || 0); }, 0);
    var net = income - spent;
    var html = '<section>';
    html += '  <div class="section-head"><span class="section-title">💵 Cash flow</span><span class="section-hint">Income logged on the Income page minus what you spent</span></div>';
    html += '  <div class="stat-row" style="grid-template-columns:repeat(2,1fr)">';
    html += statTile("📥 Income", currency.format(income));
    html += statTile(net >= 0 ? "📈 Net" : "📉 Net", (net >= 0 ? "+" : "−") + currency.format(Math.abs(net)));
    html += '  </div>';
    if(monthKey && monthKey === currentMonthKey() && totalBudget > 0){
      var today = new Date();
      var daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
      var dayOfMonth = today.getDate();
      var daysLeft = daysInMonth - dayOfMonth;
      var pctMonth = Math.round((dayOfMonth / daysInMonth) * 100);
      var pctBudget = Math.round((spent / totalBudget) * 100);
      var onPace = pctBudget <= pctMonth + 5;
      html += '  <div class="pace-note ' + (onPace ? "good" : "warning") + '">' + (onPace ? "✅ " : "⚠️ ") + daysLeft + " day" + (daysLeft === 1 ? "" : "s") + " left in " + monthLabel(monthKey).split(" ")[0] + " — you&#39;ve used " + pctBudget + "% of budget with " + pctMonth + "% of the month gone</div>";
    }
    var monthTxs = state.expenses.filter(function(e){ return e.tracker === tracker && inMonth(e.date, monthKey); });
    var biggest = monthTxs.reduce(function(top, e){ return (!top || (Number(e.amount) || 0) > (Number(top.amount) || 0)) ? e : top; }, null);
    if(biggest && Number(biggest.amount) > 0){
      var bigLabel = escapeHtml(biggest.category || "Other") + (vendorLabel(biggest) ? " — " + escapeHtml(vendorLabel(biggest)) : "");
      html += '  <div class="section-hint" style="margin-top:8px">🔎 Biggest expense ' + (monthKey ? "this month" : "on record") + ': ' + bigLabel + ' — <b style="color:var(--text-primary)">' + currencyPrecise.format(Number(biggest.amount) || 0) + '</b></div>';
    }
    html += '</section>';
    return html;
  }

  function renderCashFlowTrendChart(tracker){
    var expenseMonths = monthlyHistory(tracker, 6);
    var incomeMonths = monthlyIncomeHistory(tracker, 6);
    var incomeByKey = {};
    incomeMonths.forEach(function(m){ incomeByKey[m.key] = m.income; });
    var combined = expenseMonths.map(function(m){ return { key: m.key, spent: m.spent, income: incomeByKey[m.key] || 0 }; });

    var max = Math.max.apply(null, combined.reduce(function(arr, m){ arr.push(m.spent, m.income); return arr; }, [1]));
    var w = 600, centerX = w / 2, gutterHalf = 34, outerPad = 54, rowH = 24, rowGap = 14;
    var barAreaW = centerX - gutterHalf - outerPad;
    var totalH = combined.length * rowH + (combined.length - 1) * rowGap;

    var svg = '<svg class="trend-svg" viewBox="0 0 ' + w + ' ' + (totalH + 8) + '" preserveAspectRatio="none" role="img" aria-label="Monthly expenses versus income, last 6 months" style="height:' + (totalH + 30) + 'px">';
    combined.forEach(function(m, i){
      var y = i * (rowH + rowGap) + 4;
      var expLen = Math.max(m.spent > 0 ? 4 : 0, Math.round((m.spent / max) * barAreaW));
      var incLen = Math.max(m.income > 0 ? 4 : 0, Math.round((m.income / max) * barAreaW));
      var isCurrent = m.key === currentMonthKey();
      var opacity = isCurrent ? "1" : "0.6";
      var expX = centerX + gutterHalf;
      var incX = centerX - gutterHalf - incLen;
      svg += '<rect class="cashflow-bar" data-key="' + m.key + '" data-spent="' + m.spent.toFixed(2) + '" data-income="' + m.income.toFixed(2) + '" x="' + expX + '" y="' + y + '" width="' + expLen + '" height="' + rowH + '" rx="4" style="fill:var(--chart-expense);opacity:' + opacity + '"><title>' + monthLabel(m.key) + ' expenses: ' + currency.format(m.spent) + '</title></rect>';
      svg += '<rect class="cashflow-bar" data-key="' + m.key + '" data-spent="' + m.spent.toFixed(2) + '" data-income="' + m.income.toFixed(2) + '" x="' + incX + '" y="' + y + '" width="' + incLen + '" height="' + rowH + '" rx="4" style="fill:var(--chart-income);opacity:' + opacity + '"><title>' + monthLabel(m.key) + ' income: ' + currency.format(m.income) + '</title></rect>';
      if(m.spent > 0){
        svg += '<text x="' + (expX + expLen + 8) + '" y="' + (y + rowH / 2 + 4) + '" text-anchor="start" style="font-size:10.5px;font-weight:500;fill:var(--chart-expense);opacity:' + opacity + ';font-family:\'Work Sans\',sans-serif;pointer-events:none">' + currency.format(m.spent) + '</text>';
      }
      if(m.income > 0){
        svg += '<text x="' + (incX - 8) + '" y="' + (y + rowH / 2 + 4) + '" text-anchor="end" style="font-size:10.5px;font-weight:500;fill:var(--chart-income);opacity:' + opacity + ';font-family:\'Work Sans\',sans-serif;pointer-events:none">' + currency.format(m.income) + '</text>';
      }
      var lbl = monthLabel(m.key).split(" ")[0].slice(0, 3);
      svg += '<text x="' + centerX + '" y="' + (y + rowH / 2 + 4) + '" text-anchor="middle" style="font-size:10px;fill:var(--text-muted);font-family:\'Work Sans\',sans-serif;pointer-events:none">' + lbl + '</text>';
    });
    svg += '</svg>';

    var html = '<section>';
    html += '  <div class="section-head"><span class="section-title">📊 Expenses vs. income</span><span class="section-hint"><span class="legend-dot" style="background:var(--chart-expense)"></span>Expenses (right)&nbsp;&nbsp;<span class="legend-dot" style="background:var(--chart-income)"></span>Income (left)</span></div>';
    html += '  <div class="card trend-wrap">' + svg + '<div class="trend-caption" id="cashflow-caption-' + tracker + '">Tap a bar to see that month&#39;s totals.</div></div>';
    html += '</section>';
    return html;
  }

  function renderHistorySection(tracker){
    var months = monthlyHistory(tracker, 6);
    var max = Math.max.apply(null, months.map(function(m){ return m.spent; }).concat([1]));
    var w = 600, labelW = 66, rightPad = 64, rowH = 24, rowGap = 14;
    var barAreaW = w - labelW - rightPad;
    var totalH = months.length * rowH + (months.length - 1) * rowGap;
    var accent = tracker === "wedding" ? "var(--accent-wedding)" : "var(--accent-personal)";
    var svg = '<svg class="trend-svg" viewBox="0 0 ' + w + ' ' + (totalH + 8) + '" preserveAspectRatio="none" role="img" aria-label="Monthly spending, last 6 months" style="height:' + (totalH + 30) + 'px">';
    months.forEach(function(m, i){
      var y = i * (rowH + rowGap) + 4;
      var barLen = Math.max(m.spent > 0 ? 4 : 1, Math.round((m.spent / max) * barAreaW));
      var isCurrent = m.key === currentMonthKey();
      var lbl = monthLabel(m.key).split(" ")[0].slice(0, 3);
      svg += '<text x="' + (labelW - 8) + '" y="' + (y + rowH / 2 + 4) + '" text-anchor="end" style="font-size:11px;fill:var(--text-secondary);font-family:\'Work Sans\',sans-serif;pointer-events:none">' + lbl + '</text>';
      svg += '<rect class="trend-bar hist-bar" data-key="' + m.key + '" data-amount="' + m.spent.toFixed(2) + '" x="' + labelW + '" y="' + y + '" width="' + barLen + '" height="' + rowH + '" rx="4" style="fill:' + accent + ';opacity:' + (isCurrent ? '1' : '0.55') + '"><title>' + monthLabel(m.key) + ': ' + currency.format(m.spent) + '</title></rect>';
      svg += '<text x="' + (labelW + barLen + 8) + '" y="' + (y + rowH / 2 + 4) + '" text-anchor="start" style="font-size:11px;font-weight:500;fill:var(--text-primary);font-family:\'Work Sans\',sans-serif;pointer-events:none">' + currency.format(m.spent) + '</text>';
    });
    svg += '</svg>';
    var lastTap = state.histCaption && state.histCaption[tracker];
    var captionText = lastTap ? (monthLabel(lastTap.key) + ": " + currency.format(lastTap.amount)) : "Tap a bar to see that month’s total.";
    var html = '<section>';
    html += '  <div class="section-head"><span class="section-title">📈 6-month history</span><span class="section-hint">' + (tracker === "personal" ? "Tap a bar to jump to that month" : "Total spend by month") + '</span></div>';
    html += '  <div class="card trend-wrap">' + svg + '<div class="trend-caption" id="hist-caption-' + tracker + '">' + captionText + '</div></div>';
    html += '</section>';
    return html;
  }

  function renderVendorsSummaryCard(){
    var items = (state.vendors.wedding && state.vendors.wedding.items) || [];
    var total = items.reduce(function(s, v){ return s + (Number(v.total) || 0); }, 0);
    var paid = items.reduce(function(s, v){ return s + (Number(v.paid) || 0); }, 0);

    html += '  </div>';
    html += '</section>';
    return html;
  }

  function renderCategoryDetail(tracker, name){
    var monthKey = monthKeyFor(tracker);
    var totals = categoryTotals(tracker, monthKey);
    var idx = totals.findIndex(function(t){ return t.name === name; });
    var cat = idx >= 0 ? totals[idx] : { name: name, budget: 0, spent: 0 };
    var swatchVar = seriesVarFor(idx < 0 ? 0 : idx);
    var remaining = cat.budget - cat.spent;
    var st = statusFor(cat.spent, cat.budget);
    var statusLabel = st === "critical" ? "Over budget" : st === "warning" ? "Near limit" : "On track";
    var txs = state.expenses.filter(function(e){ return e.tracker === tracker && e.category === name && inMonth(e.date, monthKey); })
      .slice().sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });

    var html = '<button type="button" class="back-link" data-action="nav" data-tracker="' + tracker + '" data-page="dashboard">← Dashboard</button>';
    html += '<section>';
    html += '  <div class="section-head"><span class="section-title" style="display:flex;align-items:center;gap:8px"><span class="swatch" style="width:10px;height:10px;border-radius:50%;display:inline-block;background:var(' + swatchVar + ')"></span>' + escapeHtml(name) + '</span>' + (monthKey ? '<span class="section-hint">' + monthLabel(monthKey) + '</span>' : '<span class="section-hint">All-time</span>') + '</div>';
    html += '  <div class="stat-row">';
    html += statTile("💰 Budgeted", currency.format(cat.budget));
    html += statTile("💸 Spent", currency.format(cat.spent), cat.milesSpent > 0 ? '<div class="section-hint" style="margin-top:6px">✈️ ' + currency.format(cat.milesSpent) + ' of that paid in miles</div>' : '');
    html += statTile(remaining < 0 ? "Over by" : "Remaining", currency.format(Math.abs(remaining)), '<span class="status-chip ' + st + '"><span class="dot"></span>' + statusLabel + '</span>');
    html += '  </div>';
    html += '  <p class="section-hint" style="margin-top:10px">To change this category&#39;s budget or remove it, use <button type="button" class="back-link" style="margin:0;display:inline" data-action="nav" data-tracker="' + tracker + '" data-page="manage">Manage →</button></p>';
    html += '</section>';

    var subTotals = subcategoryTotals(tracker, name, monthKey).filter(function(t){ return t.spent > 0; });
    if(subTotals.length){
      subTotals.sort(function(a, b){ return b.spent - a.spent; });
      html += '<section>';
      html += '  <div class="section-head"><span class="section-title">🏷️ By subcategory</span></div>';
      html += '  <div class="card" style="padding:6px 16px">';
      subTotals.forEach(function(t){
        html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)"><span style="font-size:13.5px' + (t.name === "No subcategory" ? ';color:var(--text-muted)' : '') + '">' + escapeHtml(t.name) + '</span><b style="font-family:\'IBM Plex Mono\',monospace;font-size:13.5px">' + currency.format(t.spent) + '</b></div>';
      });
      html += '  </div>';
      html += '</section>';
    }

    var showVendor = hasVendorTags(tracker);
    html += '<section>';
    html += '  <div class="section-head"><span class="section-title">📒 Transactions</span></div>';

  function filteredLogTxs(tracker){
    var totals = categoryTotals(tracker, null);
    var f = state.logFilter[tracker];

      if(e.tracker !== tracker) return false;
      if(f.category && e.category !== f.category) return false;

      if(f.q){
        var q = f.q.toLowerCase();
        var hay = ((e.note || "") + " " + (e.category || "") + " " + paymentLabel(e)).toLowerCase();
        if(hay.indexOf(q) === -1) return false;

      return true;
    });
    return { txs: txs, totals: totals };
  }

  function vendorStatus(v){
    var balance = (Number(v.total) || 0) - (Number(v.paid) || 0);
    if(balance <= 0) return { label: "Paid in full", cls: "good" };
    if(v.dueDate && v.dueDate < todayStr()) return { label: "Past due", cls: "critical" };
    if(v.dueDate){
      var days = Math.round((new Date(v.dueDate) - new Date(todayStr())) / 86400000);
      if(days <= 14) return { label: "Due soon", cls: "warning" };
    }
    return { label: "Deposit pending", cls: "warning" };
  }

  function renderBackupImportPreview(){

  function renderPanel(tracker){
    var panel = document.getElementById(tracker + "-panel");
    var html = "";
    if(state.page === "detail" && state.detailCategory){
      html = renderCategoryDetail(tracker, state.detailCategory);
    } else if(state.page === "log"){
      html = renderLogPage(tracker);
    } else if(state.page === "income"){
      html = renderIncomePage(tracker);
    } else if(state.page === "manage"){
      html = renderManagePage(tracker);
    } else if(state.page === "salary" && tracker === "personal"){
      html = subnavHtml(tracker) + renderSalaryPage();
    } else {
      html = subnavHtml(tracker) + renderDashboard(tracker);
    }
    panel.innerHTML = html;
  }

  // ---------- receipt scanning (sample capability) ----------

  function setSelectValueOrFallback(select, value, fallback){
    if(!select) return;
    var found = Array.prototype.some.call(select.options, function(o){ return o.value === value; });
    select.value = found ? value : (fallback || select.value);
  }

  function makeThumbnail(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function(){
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        try{ resolve(canvas.toDataURL("image/jpeg", quality)); }
        catch(e){ reject(e); }
      };
      img.onerror = function(e){ URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }

  var PERMANENT_HIDE_CODES = ["not_granted", "sampling_disabled", "not_declared", "images_unavailable", "capability_disabled", "capability_removed"];

  function runReceiptScan(tracker, file){
    if(!state.sample) return;
    var panel = document.getElementById(tracker + "-panel");
    var btn = panel && panel.querySelector('[data-action="scan-receipt"]');
    var originalLabel = btn ? btn.textContent : "";
    if(btn){ btn.disabled = true; btn.textContent = "Reading receipt…"; }

    var categoryNames = ((state.budgets[tracker] && state.budgets[tracker].categories) || []).map(function(c){ return c.name; });
    var prompt = "This image is a photo of a purchase receipt. Extract the total amount paid, the purchase date, the merchant name, and the best-fitting spending category.\n" +
      "Choose the category from exactly this list (pick the closest match, or \"Other\" if none fit): " + categoryNames.join(", ") + ".\n" +
      "Reply with ONLY a JSON object of the shape: {\"merchant\": string, \"amount\": number, \"date\": \"YYYY-MM-DD\" or null, \"category\": string, \"note\": string}. " +
      "The note should be a short 3-6 word description. If a field is not visible on the receipt, use null.";

    state.sample.json(prompt, { images: file, modelTier: "default" }).then(function(result){
      var form = panel && panel.querySelector('[data-action="add-expense"]');
      if(form && result){
        if(result.category) setSelectValueOrFallback(form.category, String(result.category), "Other");
        if(typeof result.amount === "number" && result.amount > 0) form.amount.value = result.amount.toFixed(2);
        if(result.date && /^\d{4}-\d{2}-\d{2}$/.test(result.date)) form.date.value = result.date;
        var noteVal = [result.merchant, result.note].filter(Boolean).join(" — ");
        if(noteVal) form.note.value = noteVal.slice(0, 200);
      }
      if(btn){ btn.disabled = false; btn.textContent = "✓ Filled from receipt — review before adding"; setTimeout(function(){ if(btn.isConnected) btn.textContent = originalLabel; }, 3000); }

      makeThumbnail(file, 560, 0.6).then(function(dataUrl){
        if(dataUrl.length < 220000){
          state.pendingReceipt[tracker] = dataUrl;
          var box = document.getElementById("receipt-preview-" + tracker);
          if(box){
            box.innerHTML = '<img class="receipt-thumb" src="' + dataUrl + '" alt="Receipt preview" data-action="open-receipt-preview">' +
              '<span class="receipt-preview-note">Attached to this expense</span>' +
              '<button type="button" class="receipt-clear" data-action="clear-receipt" data-tracker="' + tracker + '">Remove photo</button>';
          }
        }
      }).catch(function(){ /* thumbnail is a nice-to-have; skip silently */ });
    }).catch(function(err){
      var code = err && err.code;
      if(PERMANENT_HIDE_CODES.indexOf(code) !== -1){
        state.sampleImagesOk = false;
        render();
        return;
      }
      if(btn){
        btn.disabled = false;
        btn.textContent = "Couldn't read that receipt — tap to try again";
        setTimeout(function(){ if(btn.isConnected) btn.textContent = originalLabel; }, 4000);
      }
    });
  }

  // ---------- persistence layer ----------

  function showBanner(msg, opts){
    var el = document.getElementById("save-banner");
    if(!msg){ el.style.display = "none"; el.className = ""; el.innerHTML = ""; return; }
    opts = opts || {};
    el.style.display = "flex";
    el.className = opts.warn ? "warn" : "";
    var btn = "";
    if(opts.action){
      btn = '<button type="button" class="banner-retry" data-action="' + opts.action + '">' + (opts.actionLabel || "↻ Try again") + '</button>';
    } else if(opts.retry){
      btn = '<button type="button" class="banner-retry" data-action="reload-page">↻ Try reconnecting</button>';
    }
    el.innerHTML = "<span>" + escapeHtml(msg) + "</span>" + btn;
  }

  function markSynced(){
    state.lastSyncedAt = new Date();
    renderSyncStatus();
  }

  function reportSyncError(label, err){
    console.error(label + " sync error", err);
    if(state.syncErrors.indexOf(label) === -1) state.syncErrors.push(label);
    drive.connected = false;
    showBanner("Couldn't save to Google Drive just now (your local view is still fine, but changes aren't backed up). This usually means your Drive session expired — reconnect to keep saving.", { warn: true, action: "connect-drive", actionLabel: "🔗 Reconnect Google Drive" });
    renderSyncStatus();
  }

  function lastEntryTimestamp(){
    var latest = null;
    state.expenses.forEach(function(e){
      var t = e.createdAt || e.updatedAt || null;
      if(t && (!latest || t > latest)) latest = t;
    });
    return latest;
  }

  function renderSyncStatus(){
    var el = document.getElementById("sync-status");
    if(!el) return;
    
    if(!state.isOnline){
      el.innerHTML = '<div class="offline-indicator"><span class="offline-dot"></span>📱 Offline · Changes saved locally. Will sync when back online.</div>';
      return;
    }
    
    if(!state.lastSyncedAt){ el.textContent = ""; return; }
    var parts = ["Last refreshed " + state.lastSyncedAt.toLocaleTimeString()];
    var lastEntry = lastEntryTimestamp();
    if(lastEntry){
      var d = new Date(lastEntry);
      if(!isNaN(d.getTime())) parts.push("last entry logged " + d.toLocaleString());
    }
    if(state.syncErrors.length) parts.push("⚠ sync issue: " + state.syncErrors.join(", "));
    el.textContent = parts.join(" · ");
  }

  var localIdCounter = 1;

    var auth = getSavedAuth();

  function recordChange(tracker, summary){
    if(!state.changeLog) state.changeLog = [];
    state.changeLog.unshift({ at: new Date().toISOString(), by: currentUserName(), tracker: tracker, summary: summary });
    if(state.changeLog.length > 20) state.changeLog.length = 20;

  function saveBudget(tracker, categories, hint){
    var payload = { categories: categories, hint: hint || (DEFAULT_BUDGETS[tracker] && DEFAULT_BUDGETS[tracker].hint) || "", updatedAt: new Date().toISOString() };
    state.budgets[tracker] = payload;
    render();
    schedulePersist();
  }

  function addExpense(expense){
    normalizeExpense(expense);
    if(expense.tracker === "wedding" && expense.vendorId){
      applyVendorPaymentAmount(expense.vendorId, Number(expense.amount) || 0);
    }
    state.expenses.unshift(Object.assign({ id: uid("exp") }, expense));
    var summary = "Logged " + currencyPrecise.format(Number(expense.amount) || 0) + " expense in " + (expense.category || "Other");
    if(expense.note) summary += " (" + expense.note + ")";
    recordChange(expense.tracker, summary);
    schedulePersist();
  }

  function applyVendorPaymentAmount(vendorId, amount){
    var v = vendorById(vendorId);
    if(!v || !amount) return;
    v.paid = (Number(v.paid) || 0) + amount;
    schedulePersist();
  }

  function deleteExpense(id){
    var removed = state.expenses.find(function(e){ return e.id === id; });
    state.expenses = state.expenses.filter(function(e){ return e.id !== id; });
    if(removed){
      recordChange(removed.tracker, "Deleted " + currencyPrecise.format(Number(removed.amount) || 0) + " expense in " + (removed.category || "Other"));
    }
    render();
    schedulePersist();
  }

  function updateExpense(id, changes){
    var idx = state.expenses.findIndex(function(e){ return e.id === id; });
    if(idx === -1) return;
    var old = state.expenses[idx];
    var updated = Object.assign({}, old, changes);
    normalizeExpense(updated);

    if(old.tracker === "wedding" && old.vendorId && old.vendorId !== updated.vendorId){
      applyVendorPaymentAmount(old.vendorId, -(Number(old.amount) || 0));
    }
    if(updated.tracker === "wedding" && updated.vendorId){
      if(old.vendorId === updated.vendorId){
        var delta = (Number(updated.amount) || 0) - (Number(old.amount) || 0);
        if(delta) applyVendorPaymentAmount(updated.vendorId, delta);
      } else {

  function payFrequencyMeta(id){

  function computePaycheck(){
    var s = state.salarySetup;
    var freq = payFrequencyMeta(s.payFrequency);
    var gross = (Number(s.annualSalary) || 0) / freq.periods;
    var deductions = (s.deductions || []).map(function(d){
      var amt = d.kind === "percent" ? gross * (Number(d.value) || 0) / 100 : (Number(d.value) || 0);
      return { id: d.id, name: d.name, kind: d.kind, value: d.value, amount: amt };
    });
    var totalDeductions = deductions.reduce(function(sum, d){ return sum + d.amount; }, 0);
    var net = gross - totalDeductions;
    return { freq: freq, gross: gross, deductions: deductions, totalDeductions: totalDeductions, net: net };
  }

    var existingIds = {};
    state.expenses.forEach(function(e){ existingIds[e.id] = true; });

    (data.expenses || []).forEach(function(e){
      if(!e || !e.id || existingIds[e.id]) return;
      var payload = Object.assign({}, e);
      delete payload.id;
      normalizeExpense(payload);
      state.expenses.push(Object.assign({ id: e.id }, payload));
      existingIds[e.id] = true;
      added++;
    });
    state.expenses.sort(function(a, b){ return (b.date || "").localeCompare(a.date || ""); });
    schedulePersist();
    return added;

  function handleCsvImport(file){
    var tracker = state.tracker;
    var defaultType = "bank_transfer";
    var reader = new FileReader();
    reader.onload = function(){
      var rows = parseCsv(String(reader.result || ""));
      if(rows.length < 2) return;
      var header = rows[0].map(function(h){ return h.trim().toLowerCase(); });
      var dateIdx = header.findIndex(function(h){ return /date/.test(h); });
      var descIdx = header.findIndex(function(h){ return /(description|memo|payee|merchant|name)/.test(h); });
      var amountIdx = header.findIndex(function(h){ return /^amount$/.test(h) || /debit/.test(h); });
      if(amountIdx === -1) amountIdx = header.findIndex(function(h){ return /amount/.test(h); });
      if(dateIdx === -1 || amountIdx === -1) return;

      var parsed = [];
      rows.slice(1).forEach(function(r){
        var rawDate = (r[dateIdx] || "").trim();
        var rawAmount = (r[amountIdx] || "").replace(/[^0-9.\-]/g, "");
        var amount = Math.abs(parseFloat(rawAmount));
        if(!rawDate || !amount) return;
        var d = new Date(rawDate);
        if(isNaN(d.getTime())) return;
        var iso = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
        parsed.push({ date: iso, note: descIdx >= 0 ? (r[descIdx] || "").trim().slice(0, 100) : "Imported transaction", amount: amount, category: "Other", include: true });
      });
      parsed = parsed.slice(0, 200);
      if(parsed.length === 0) return;

      var categoryNames = ((state.budgets[tracker] && state.budgets[tracker].categories) || []).map(function(c){ return c.name; });
      if(state.sample && categoryNames.length){
        var prompt = "Assign the best category to each bank transaction description below, from exactly this list: " + categoryNames.join(", ") + " (use \"Other\" if none fit).\n" +
          "Reply with ONLY a JSON array of category strings, one per line below, in the same order, same length.\n\n" +
          parsed.map(function(p, i){ return (i + 1) + ". " + p.note + " ($" + p.amount.toFixed(2) + ")"; }).join("\n");
        state.sample.json(prompt).then(function(cats){
          if(Array.isArray(cats)){
            parsed.forEach(function(p, i){ if(cats[i] && categoryNames.indexOf(String(cats[i])) !== -1) p.category = String(cats[i]); });
          }
          state.importPreview = { tracker: tracker, type: defaultType, rows: parsed };
          render();
        }).catch(function(){
          state.importPreview = { tracker: tracker, type: defaultType, rows: parsed };
          render();
        });
      } else {
        state.importPreview = { tracker: tracker, type: defaultType, rows: parsed };
        render();
      }
    };
    reader.readAsText(file);
  }

  // ---------- Google Drive auth + sync ----------

  function driveConfigured(){
    return GOOGLE_CLIENT_ID.indexOf("PASTE_YOUR_GOOGLE_CLIENT_ID_HERE") === -1;
  }

  function connectDrive(){
    if(!driveConfigured()){
      showBanner("This copy hasn't been set up with a Google Client ID yet. See the \"GOOGLE DRIVE SETUP\" comment near the top of the file for the one-time steps, paste your Client ID in, then reload.", { warn: true });
      return;
    }
    if(typeof google === "undefined" || !google.accounts || !google.accounts.oauth2){
      showBanner("Still loading Google's sign-in library — try again in a second.", { warn: true, action: "connect-drive", actionLabel: "↻ Try again" });
      return;
    }
    showBanner("Connecting to Google Drive…");
    if(!drive.tokenClient){
      drive.tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: "https://www.googleapis.com/auth/drive.file openid email profile",
        callback: function(resp){
          if(!resp || resp.error){
            showBanner("Google Drive sign-in didn't go through.", { warn: true, action: "connect-drive", actionLabel: "↻ Try again" });
            return;
          }
          drive.accessToken = resp.access_token;
          // Fetch user info and save
          fetch("https://www.googleapis.com/oauth2/v2/userinfo", {
            headers: { Authorization: "Bearer " + resp.access_token }
          }).then(function(res){ return res.json(); }).then(function(userInfo){
            if(userInfo && !userInfo.error){
              saveAuth(userInfo, resp.access_token);
              renderAuthUI();
            }
            loadFromDrive();
          }).catch(function(){
            // Continue without saving user info
            loadFromDrive();
          });
        }
      });
    }
    drive.tokenClient.requestAccessToken({ prompt: drive.accessToken ? "" : "consent" });
  }

  function driveApiFetch(url, opts){
    opts = opts || {};
    opts.headers = Object.assign({ Authorization: "Bearer " + drive.accessToken }, opts.headers || {});
    return fetch(url, opts).then(function(res){
      if(!res.ok){
        return res.text().then(function(t){
          var err = new Error("Drive API " + res.status + ": " + t);
          err.status = res.status;
          throw err;
        });
      }
      return res;
    });
  }

  function driveFindFile(){
    var q = encodeURIComponent("name = '" + DRIVE_FILE_NAME + "' and trashed = false");
    var url = "https://www.googleapis.com/drive/v3/files?q=" + q + "&spaces=drive&fields=files(id,name)";
    return driveApiFetch(url).then(function(res){ return res.json(); }).then(function(json){
      return (json.files && json.files[0]) ? json.files[0].id : null;
    });
  }

  function driveGetFileContent(fileId){
    var url = "https://www.googleapis.com/drive/v3/files/" + fileId + "?alt=media";
    return driveApiFetch(url).then(function(res){ return res.json(); });
  }

  function driveMultipartCreate(name, dataObj){
    var boundary = "budgetledger-" + Date.now();
    var metadata = { name: name, mimeType: "application/json" };
    var body =
      "--" + boundary + "\r\n" +
      "Content-Type: application/json; charset=UTF-8\r\n\r\n" +
      JSON.stringify(metadata) + "\r\n" +
      "--" + boundary + "\r\n" +
      "Content-Type: application/json\r\n\r\n" +
      JSON.stringify(dataObj) + "\r\n" +
      "--" + boundary + "--";
    var url = "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id";
    return driveApiFetch(url, {
      method: "POST",
      headers: { "Content-Type": "multipart/related; boundary=" + boundary },
      body: body
    }).then(function(res){ return res.json(); }).then(function(json){ return json.id; });
  }

  function driveUpdateFileContent(fileId, dataObj){
    var url = "https://www.googleapis.com/upload/drive/v3/files/" + fileId + "?uploadType=media";
    return driveApiFetch(url, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(dataObj)
    });
  }

  function applyLoadedData(data){
    data = data || {};
    var trackers = ["personal", "wedding"];

    state.budgets = data.budgets || {};
    trackers.forEach(function(t){
      if(!state.budgets[t] || !state.budgets[t].categories) state.budgets[t] = DEFAULT_BUDGETS[t];
    });

    state.expenses = Array.isArray(data.expenses) ? data.expenses.map(normalizeExpense) : [];
    state.expenses.sort(function(a, b){ return (b.date || "").localeCompare(a.date || ""); });

    state.paymentMethods = data.paymentMethods || { items: [] };
    if(!state.paymentMethods.items) state.paymentMethods.items = [];

    state.subscriptions = data.subscriptions || { personal: { items: [] }, wedding: { items: [] } };
    trackers.forEach(function(t){
      if(!state.subscriptions[t]) state.subscriptions[t] = { items: [] };
      if(!state.subscriptions[t].items) state.subscriptions[t].items = [];
      state.subscriptions[t].items.forEach(normalizeExpense);
    });

    state.income = data.income || { personal: { items: [] }, wedding: { items: [] } };
    trackers.forEach(function(t){
      if(!state.income[t]) state.income[t] = { items: [] };
      if(!state.income[t].items) state.income[t].items = [];
    });

    state.incomeTypes = (data.incomeTypes && data.incomeTypes.length) ? data.incomeTypes : null;

    state.recurringIncome = data.recurringIncome || { personal: { items: [] }, wedding: { items: [] } };
    trackers.forEach(function(t){
      if(!state.recurringIncome[t]) state.recurringIncome[t] = { items: [] };
      if(!state.recurringIncome[t].items) state.recurringIncome[t].items = [];
    });

    state.salarySetup = data.salarySetup || { annualSalary: 0, payFrequency: "biweekly", deductions: [] };

    state.vendors = data.vendors || { wedding: { items: [] } };
    if(!state.vendors.wedding) state.vendors.wedding = { items: [] };
    if(!state.vendors.wedding.items) state.vendors.wedding.items = [];
    state.vendors.wedding.items.forEach(normalizeExpense);
    
    state.savingsGoals = data.savingsGoals || { items: [] };
    if(!state.savingsGoals.items) state.savingsGoals.items = [];

    state.changeLog = Array.isArray(data.changeLog) ? data.changeLog.slice(0, 20) : [];
  }

  function loadFromDrive(){
    showBanner("Loading your data from Google Drive…");
    driveFindFile().then(function(fileId){
      if(fileId){
        drive.fileId = fileId;
        return driveGetFileContent(fileId).then(function(data){ applyLoadedData(data); });
      }
      // first time connecting — seed starter budgets and create the file in Drive
      applyLoadedData({ budgets: { personal: DEFAULT_BUDGETS.personal, wedding: DEFAULT_BUDGETS.wedding } });
      return driveMultipartCreate(DRIVE_FILE_NAME, buildFullBackupObject()).then(function(id){ drive.fileId = id; });
    }).then(function(){
      drive.connected = true;
      state.syncErrors = [];
      showBanner(null);
      render();
      markSynced();
    }).catch(function(err){
      console.error("Drive load failed", err);
      state.budgets.personal = state.budgets.personal || DEFAULT_BUDGETS.personal;
      state.budgets.wedding = state.budgets.wedding || DEFAULT_BUDGETS.wedding;
      drive.connected = false;
      showBanner("Couldn't load your data from Google Drive. What's shown below are starter placeholders, not your saved data (which is untouched). Reconnect to try again.", { warn: true, action: "connect-drive", actionLabel: "🔗 Reconnect Google Drive" });
      render();
    });
  }

  function persistToDriveNow(){
    if(!drive.connected || !drive.accessToken) return;
    var payload = buildFullBackupObject();
    var work = drive.fileId
      ? driveUpdateFileContent(drive.fileId, payload)
      : driveMultipartCreate(DRIVE_FILE_NAME, payload).then(function(id){ drive.fileId = id; });
    work.then(function(){
      state.syncErrors = [];
      markSynced();
    }).catch(function(err){ reportSyncError("Google Drive", err); });
  }

  function schedulePersist(){
    if(persistTimer) clearTimeout(persistTimer);
    persistTimer = setTimeout(function(){
      persistTimer = null;
      updateOverBudgetCategories();
      saveToIndexedDB();
      persistToDriveNow();
    }, 800);
  }
