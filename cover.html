<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget Ledger</title>
<meta name="description" content="Personal spending and wedding costs, tracked side by side.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Work+Sans:wght@400;600&display=swap">
<script>
  // Use the ledger's saved theme (index.html) so the cover matches it.
  try{ var t = localStorage.getItem("budgetLedgerTheme"); if(t) document.documentElement.setAttribute("data-theme", t); }catch(e){}
</script>
<style>
  :root{
    color-scheme: light;
    --bg: #f7f2e9;
    --text-primary: #221d15;
    --text-secondary: #6e6656;
    --accent: #2f6f62;
    --on-accent: #ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]):not([data-theme="editorial"]){
      color-scheme: dark;
      --bg: #16130e;
      --text-primary: #f4efe4;
      --text-secondary: #c7bea9;
      --accent: #59a892;
      --on-accent: #16130e;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg: #16130e;
    --text-primary: #f4efe4;
    --text-secondary: #c7bea9;
    --accent: #59a892;
    --on-accent: #16130e;
  }
  :root[data-theme="editorial"]{
    --bg: #ece5d3;
    --text-primary: #1c1913;
    --text-secondary: #4a4436;
    --accent: #2f4a3a;
  }
  body{
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 24px;
    box-sizing: border-box;
    background: var(--bg);
    color: var(--text-primary);
    font-family: "Work Sans", system-ui, -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  main{ max-width: 520px; }
  h1{
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: clamp(40px, 8vw, 56px);
    line-height: 1.05;
    margin: 0 0 10px;
  }
  .tagline{ font-size: 18px; color: var(--text-secondary); margin: 0 0 24px; text-wrap: balance; }
  ul{ margin: 0 0 32px; padding-left: 20px; color: var(--text-secondary); }
  li + li{ margin-top: 6px; }
  .cta{
    display: inline-block;
    padding: 12px 24px;
    border-radius: 100px;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
    text-decoration: none;
  }
  .cta:hover{ filter: brightness(1.1); }
  .cta:focus-visible{ outline: 3px solid var(--text-primary); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Budget Ledger</h1>
  <p class="tagline">Personal spending and wedding costs, tracked side by side.</p>
  <ul>
    <li>Personal and wedding budgets, side by side</li>
    <li>Log expenses and income</li>
    <li>Saved to your own Google Drive</li>
  </ul>
  <a class="cta" href="./">Open Ledger →</a>
</main>
</body>
</html>
