<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
  <title id="t">My Budget Ledger</title>
  <desc id="d">Cover image: a ruled ledger page with the title My Budget Ledger, Personal and Wedding tracker tags, and a small spend-versus-budget bar chart.</desc>
  <defs>
    <pattern id="rules" width="1200" height="32" patternUnits="userSpaceOnUse">
      <line x1="0" y1="31.5" x2="1200" y2="31.5" stroke="#e4dccb" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- ledger paper -->
  <rect width="1200" height="520" fill="#f7f2e9"/>
  <rect width="1200" height="520" fill="url(#rules)"/>
  <line x1="96" y1="0" x2="96" y2="520" stroke="#a8552f" stroke-opacity="0.35" stroke-width="2"/>
  <line x1="102" y1="0" x2="102" y2="520" stroke="#a8552f" stroke-opacity="0.35" stroke-width="2"/>

  <!-- title block -->
  <text x="150" y="140" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="6" fill="#7a6f5e">PERSONAL FINANCE</text>
  <text x="147" y="225" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="74" font-weight="600" fill="#221d15">My Budget Ledger</text>
  <text font-family="'Work Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#4a4235">
    <tspan x="150" y="280">Personal &amp; wedding budgets,</tspan>
    <tspan x="150" y="312">synced to your own Google Drive.</tspan>
  </text>

  <!-- tracker tags -->
  <g font-family="'Work Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
    <rect x="150" y="350" width="138" height="42" rx="21" fill="#2f6f62" fill-opacity="0.12" stroke="#2f6f62" stroke-width="1.5"/>
    <text x="219" y="378" text-anchor="middle" fill="#2f6f62">Personal</text>
    <rect x="302" y="350" width="134" height="42" rx="21" fill="#a8552f" fill-opacity="0.12" stroke="#a8552f" stroke-width="1.5"/>
    <text x="369" y="378" text-anchor="middle" fill="#a8552f">Wedding</text>
  </g>

  <text x="150" y="450" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="18" fill="#7a6f5e">billywall732.github.io/my-budget-ledger</text>

  <!-- spend vs budget chart -->
  <g transform="translate(870 130)">
    <rect x="-30" y="-30" width="300" height="300" rx="18" fill="#ffffff" stroke="#e4dccb" stroke-width="1.5"/>
    <text x="0" y="6" font-family="'Work Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="1.5" fill="#7a6f5e">SPENT VS BUDGET</text>
    <g font-family="'IBM Plex Mono', Consolas, monospace" font-size="13" fill="#7a6f5e">
      <rect x="0"   y="60"  width="36" height="170" rx="4" fill="#e4dccb"/>
      <rect x="0"   y="110" width="36" height="120" rx="4" fill="#2f6f62"/>
      <rect x="60"  y="60"  width="36" height="170" rx="4" fill="#e4dccb"/>
      <rect x="60"  y="150" width="36" height="80"  rx="4" fill="#2f6f62"/>
      <rect x="120" y="60"  width="36" height="170" rx="4" fill="#e4dccb"/>
      <rect x="120" y="85"  width="36" height="145" rx="4" fill="#a8552f"/>
      <rect x="180" y="60"  width="36" height="170" rx="4" fill="#e4dccb"/>
      <rect x="180" y="135" width="36" height="95"  rx="4" fill="#2f6f62"/>
      <line x1="-6" y1="230.5" x2="222" y2="230.5" stroke="#c9bfab" stroke-width="1"/>
      <text x="18"  y="254" text-anchor="middle">JUL</text>
      <text x="78"  y="254" text-anchor="middle">AUG</text>
      <text x="138" y="254" text-anchor="middle">SEP</text>
      <text x="198" y="254" text-anchor="middle">OCT</text>
    </g>
  </g>
</svg>
