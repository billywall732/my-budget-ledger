<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Budget Ledger home-screen icon: a gold coin with a $ on a short coin stack, in the Off the
       Wall app-icon style (one object on a dark glow in the app's color, two swooshes) -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#6e5310"/><stop offset="1" stop-color="#170f02"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset=".55" stop-color="#f2b52e"/><stop offset="1" stop-color="#c98612"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b9780e"/><stop offset=".5" stop-color="#e9a623"/><stop offset="1" stop-color="#a86a0a"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-opacity=".85">
    <path d="M358 79 A205 205 0 0 1 449 186"/><path d="M154 434 A205 205 0 0 1 63 326"/>
  </g>
  <!-- the stack behind -->
  <g transform="translate(150 360)">
    <ellipse cx="0" cy="34" rx="78" ry="26" fill="#000" fill-opacity=".35"/>
    <rect x="-74" y="-6" width="148" height="30" fill="url(#edge)"/><ellipse cx="0" cy="24" rx="74" ry="24" fill="url(#edge)"/><ellipse cx="0" cy="-6" rx="74" ry="24" fill="#f2b52e"/>
    <rect x="-74" y="-36" width="148" height="30" fill="url(#edge)"/><ellipse cx="0" cy="-36" rx="74" ry="24" fill="#ffd45a"/>
  </g>
  <!-- the big coin -->
  <circle cx="276" cy="244" r="132" fill="#000" fill-opacity=".35" transform="translate(10 14)"/>
  <circle cx="276" cy="244" r="132" fill="#a86a0a"/>
  <circle cx="276" cy="236" r="128" fill="url(#gold)"/>
  <circle cx="276" cy="236" r="100" fill="none" stroke="#b97c0e" stroke-width="10"/>
  <g fill="none" stroke="#9a6206" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M316 190 C304 170 238 166 236 200 C234 236 318 228 318 266 C318 300 248 304 232 278"/>
    <path d="M276 152 V320"/>
  </g>
  <path d="M190 160 A110 110 0 0 1 250 128" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="14" stroke-linecap="round"/>
</svg>
